<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#fafaf7" />
<title>Teckel's · Food & Drinks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Manrope:wght@300;400;500;600;700&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #fafaf6;
    --ink: #15140f;
    --ink-soft: #4a4838;
    --accent: #6b1d1d;
    --line: #2a2820;
    --paper: #ffffff;
    --muted: #8a8775;
    --bun: #d9c79a;
    --topbar-from: rgba(250,250,246,0.97);
    --topbar-mid: rgba(250,250,246,0.92);
    --body-gradient: radial-gradient(1200px 600px at 50% -200px, #f3efe2 0%, transparent 60%), #fafaf6;
    --logo-filter: none;
    --transition-theme: background .35s ease, color .35s ease, border-color .35s ease;
  }

  html.dark .section{ background: rgba(255,255,255,0.04); }
  html.dark .tabs{ background: var(--paper); border-color: var(--line); }
  html.dark .lang{ background: var(--paper); border-color: var(--line); }
  html.dark{
    --bg: #111009;
    --ink: #f0ead8;
    --ink-soft: #b0a98e;
    --accent: #e07a5f;
    --line: #d4c9a8;
    --paper: #1a1812;
    --muted: #6a6455;
    --topbar-from: rgba(17,16,9,0.97);
    --topbar-mid: rgba(17,16,9,0.92);
    --body-gradient: radial-gradient(1200px 600px at 50% -200px, #1f1c0e 0%, transparent 60%), #111009;
    --logo-filter: invert(1) brightness(1.1);
  }

  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:'Manrope', system-ui, sans-serif; font-weight:400; line-height:1.45; -webkit-font-smoothing:antialiased; transition:background .35s ease, color .35s ease;}
  body{
    background: var(--body-gradient);
    min-height: 100dvh;
    overflow-x: hidden;
  }

  /* subtle paper texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(rgba(0,0,0,0.025) 1px, transparent 1px);
    background-size: 3px 3px;
    pointer-events:none;
    mix-blend-mode:multiply;
    z-index:0;
  }

  .shell{
    position:relative; z-index:1;
    max-width: 520px;
    margin: 0 auto;
    padding: 24px 18px 96px;
  }

  /* ===== Top bar ===== */
  .topbar{
    position:sticky; top:0; z-index:30;
    margin: -24px -18px 0;
    padding: 14px 18px 10px;
    background: linear-gradient(180deg, var(--topbar-from) 0%, var(--topbar-mid) 80%, transparent 100%); transition: background .35s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    display:flex; align-items:center; justify-content:space-between;
    gap: 12px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .crest{
    width:52px; height:52px; flex:0 0 52px;
    display:grid; place-items:center;
    color: var(--ink);
  }
  .crest svg{width:100%; height:100%;}
  .brand-words{
    display:none; flex-direction:column; line-height:1;
  }
  .brand-name{
    font-family:'Archivo', sans-serif; font-weight:900;
    font-size: 18px; letter-spacing: 0.02em;
  }
  .brand-tag{
    font-family:'Archivo', sans-serif; font-weight:500;
    font-size: 9px; letter-spacing: 0.32em;
    color: var(--ink-soft);
    margin-top: 4px;
  }

  .lang{
    display:flex; align-items:center;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 3px;
    background: var(--paper);
  }
  .lang button{
    border:0; background:transparent; cursor:pointer;
    font-family:'Archivo', sans-serif; font-weight:700;
    font-size: 11px; letter-spacing: 0.12em;
    padding: 6px 10px;
    border-radius: 999px;
    color: var(--ink-soft);
    transition: all .25s ease;
  }
  .lang button.on{
    background: var(--ink);
    color: #fff7e6;
  }

  /* ===== Hero ===== */
  .hero{
    text-align:center;
    padding: 22px 4px 12px;
  }
  .hero h1{
    margin:0;
    font-family:'Archivo', sans-serif;
    font-weight:900;
    font-size: clamp(38px, 11vw, 52px);
    letter-spacing: -0.01em;
    line-height: 0.95;
  }
  .hero .season{
    display:inline-block;
    margin-top: 8px;
    font-family:'Caveat', cursive;
    font-weight:600;
    font-size: 30px;
    color: var(--accent);
    transform: rotate(-2deg);
  }
  .hero .rule{
    width: 60px; height: 1px;
    background: var(--ink);
    margin: 18px auto 0;
    opacity: .35;
  }

  /* ===== Tabs Food / Drinks ===== */
  .tabs{
    display:flex; gap: 8px; justify-content:center;
    margin: 18px 0 26px;
    position: sticky; top: 60px; z-index: 25;
    padding: 6px;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 6px 22px -10px rgba(0,0,0,0.18);
  }
  .tabs button{
    flex:1;
    border:0; cursor:pointer;
    background: transparent;
    padding: 10px 14px;
    font-family:'Archivo', sans-serif; font-weight:800;
    font-size: 12px; letter-spacing: 0.22em;
    color: var(--ink-soft);
    border-radius: 999px;
    transition: all .3s cubic-bezier(.2,.7,.2,1);
  }
  .tabs button.on{
    background: var(--ink);
    color: #fff7e6;
  }

  /* ===== Section card with dashed border ===== */
  .section{
    border: 1.5px dashed var(--line);
    border-radius: 18px;
    padding: 20px 18px 22px;
    margin: 0 0 22px;
    background: rgba(255,255,255,0.55); transition: background .35s ease, border-color .35s ease;
    position: relative;
    animation: rise .5s ease both;
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(8px);}
    to{ opacity:1; transform:none;}
  }

  .section-head{
    display:flex; align-items:center; gap: 10px;
    margin: -34px 0 18px;
  }
  .section-head h2{
    margin: 0;
    background: var(--bg);
    padding: 0 10px;
    font-family:'Archivo', sans-serif; font-weight:900;
    font-size: 18px; letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .section-head .head-line{
    flex:1; height: 1px; background: var(--ink); opacity: .85;
  }

  .item{
    padding: 12px 0;
    border-bottom: 1px dotted rgba(0,0,0,0.12);
  }
  .item:last-child{ border-bottom: 0; padding-bottom: 4px;}
  .item-row{
    display:flex; gap: 14px; align-items: baseline; justify-content: space-between;
  }
  .item-name{
    font-family:'Archivo', sans-serif; font-weight:700;
    font-size: 14.5px; letter-spacing: 0.01em;
  }
  .item-price{
    font-family:'Archivo', sans-serif; font-weight:800;
    font-size: 14px;
    white-space: nowrap;
    color: var(--ink);
  }
  .item-desc{
    margin-top: 4px;
    font-style: italic;
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.45;
  }
  .item-add{
    margin-top: 6px;
    font-size: 12px;
    color: var(--accent);
    font-weight:600;
    font-style: italic;
  }

  /* compact (extras) variant */
  .section.compact .item{padding: 9px 0;}
  .section.compact .item-name{font-size: 13.5px;}
  .section.compact .item-price{font-size: 13.5px;}

  /* footer */
  footer{
    text-align:center;
    margin-top: 28px;
    font-style: italic;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 0 12px;
  }
  footer .sig{
    font-family:'Caveat', cursive;
    color: var(--accent);
    font-size: 22px;
    display:block;
    margin-top: 8px;
  }

  /* hide pages */
  .page{display:none;}
  .page.on{display:block;}

  /* fade in on switch */
  .page.on .section{ animation: rise .45s ease both; }
  .page.on .section:nth-child(2){ animation-delay: .05s;}
  .page.on .section:nth-child(3){ animation-delay: .1s;}
  .page.on .section:nth-child(4){ animation-delay: .15s;}
  .page.on .section:nth-child(5){ animation-delay: .2s;}
  .page.on .section:nth-child(6){ animation-delay: .25s;}
  .page.on .section:nth-child(7){ animation-delay: .3s;}
  .page.on .section:nth-child(8){ animation-delay: .35s;}

  /* tablet / desktop: 2 columns */
  @media (min-width: 720px){
    .shell{ max-width: 900px; padding: 32px 28px 96px; }
    .topbar{ margin: -32px -28px 0; padding: 16px 28px 12px; }
    .menu-grid{
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
      align-items: start;
    }
    .section{ margin: 0; }
  }

  /* ===== Dark mode toggle ===== */
  .btn-theme{
    border: 1px solid var(--line);
    background: var(--paper);
    border-radius: 999px;
    width: 38px; height: 38px;
    display: grid; place-items: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: background .25s, border-color .25s, transform .2s;
    color: var(--ink);
  }
  .btn-theme:active{ transform: scale(0.9); }
  .btn-theme svg{ width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; transition: opacity .25s; }
  .btn-theme .icon-sun{ display:none; }
  .btn-theme .icon-moon{ display:block; }
  html.dark .btn-theme .icon-sun{ display:block; }
  html.dark .btn-theme .icon-moon{ display:none; }

</style>
</head>

/* =========================================================
   RENDER
   ========================================================= */
let currentLang = 'de';

const get = (val, lang) => typeof val === 'string' ? val : (val ? val[lang] : '');

function renderSection(s, lang){
  const items = s.items.map(it=>{
    const name = get(it.name, lang);
    const desc = it.desc ? get(it.desc, lang) : '';
    const add  = it.add  ? get(it.add , lang) : '';
    return `
      <div class="item">
        <div class="item-row">
          <div class="item-name">${name}</div>
          <div class="item-price">${it.price}</div>
        </div>
        ${desc ? `<div class="item-desc">${desc}</div>` : ''}
        ${add  ? `<div class="item-add">${add}</div>`   : ''}
      </div>`;
  }).join('');
  return `
    <section class="section ${s.compact ? 'compact' : ''}" id="sec-${s.id}">
      <div class="section-head">
        <h2>${get(s.title, lang)}</h2>
        <div class="head-line"></div>
      </div>
      ${items}
    </section>`;
}

function render(){
  document.getElementById('grid-food').innerHTML   = food.map(s=>renderSection(s, currentLang)).join('');
  document.getElementById('grid-drinks').innerHTML = drinks.map(s=>renderSection(s, currentLang)).join('');

  // ui labels
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(ui[currentLang][k]) el.textContent = ui[currentLang][k];
  });
  document.documentElement.lang = currentLang;
}

/* lang switcher */
document.querySelectorAll('.lang button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.lang button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    currentLang = btn.dataset.lang;
    render();
  });
});

/* tab switcher */
document.querySelectorAll('.tabs button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    const t = btn.dataset.tab;
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
    document.getElementById('page-'+t).classList.add('on');
    // scroll to top of menu smoothly
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });
});

/* detect browser language on first load */
(function(){
  const browser = (navigator.language || 'de').slice(0,2).toLowerCase();
  if(['de','es','en'].includes(browser)){
    currentLang = browser;
    document.querySelectorAll('.lang button').forEach(b=>{
      b.classList.toggle('on', b.dataset.lang === currentLang);
    });
  }
  render();
})();

/* dark mode toggle */
const btnTheme = document.getElementById('btnTheme');
const html = document.documentElement;
const DARK_KEY = 'teckels_dark';

// restore preference
if(localStorage.getItem(DARK_KEY) === '1') html.classList.add('dark');

btnTheme.addEventListener('click', ()=>{
  html.classList.toggle('dark');
  localStorage.setItem(DARK_KEY, html.classList.contains('dark') ? '1' : '0');
  // update theme-color meta
  document.querySelector('meta[name="theme-color"]').content =
    html.classList.contains('dark') ? '#111009' : '#fafaf7';
});
